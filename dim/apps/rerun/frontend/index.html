<!doctype html>
<!--
  Rerun — a shim that embeds the Rerun web viewer. This page (already an iframe in
  the desktop) hosts an INNER iframe pointing at a Rerun web server. It probes the
  target for reachability and only frames the viewer once it's actually up, so a
  down server never shows the browser's "unable to connect" page underneath our UI.
  It keeps retrying, and once connected the controls collapse into a small pill in
  the top-center of the view. Frontend-only — it just frames Rerun, no bridge needed.

  Tip: start a server with `rerun --serve-web` (web viewer on :9090), or point at
  any reachable Rerun web address.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="color-scheme" content="dark" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Rerun · DimOS</title>
<link rel="stylesheet" href="theme.css" />
<style>
  html, body { height: 100%; margin: 0; }
  body.science { display: flex; flex-direction: column; }

  .frame-wrap { flex: 1; position: relative; background: #05080b; overflow: hidden; }
  #viewer { width: 100%; height: 100%; border: 0; display: block; }

  /* floating control panel, top-center over the viewer */
  .panel { position: absolute; z-index: 5; top: 10px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 10px; max-width: calc(100% - 20px);
    padding: 8px 13px; border: 1px solid var(--border); border-radius: 999px;
    background: color-mix(in srgb, var(--card) 90%, transparent); backdrop-filter: blur(9px);
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4); transition: padding 0.15s ease; }
  .panel .title { font-size: 13px; font-weight: 600; letter-spacing: 0.04em; }
  .panel label { font-size: 11px; color: var(--muted-fg); letter-spacing: 0.04em; }
  .panel input { appearance: none; font: inherit; font-size: 13px; color: var(--fg); font-family: var(--mono);
    background: var(--card); border: 1px solid var(--input); border-radius: var(--radius); padding: 6px 9px; }
  .panel input:focus { outline: none; border-color: var(--ring); box-shadow: 0 0 0 2px var(--ring-soft); }
  #host { width: 140px; } #port { width: 68px; }
  .btn { appearance: none; cursor: pointer; font: inherit; font-size: 12px; font-weight: 600;
    letter-spacing: 0.04em; text-transform: uppercase; color: var(--primary-fg); background: var(--primary);
    border: 1px solid var(--primary); border-radius: var(--radius); padding: 7px 14px; }
  .btn:hover { background: color-mix(in oklch, var(--primary) 88%, black); }
  .stat { display: flex; align-items: center; gap: 7px; font-family: var(--mono); font-size: 12px; color: var(--muted-fg); }
  .stat .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted-fg); flex: none; }
  .stat .dot.on { background: var(--ok); box-shadow: 0 0 6px var(--ok); }
  .stat .dot.err { background: var(--danger); }

  /* collapsed = connected: just a compact pill (title + status), click to edit */
  .panel.collapsed { cursor: pointer; gap: 8px; padding: 7px 13px; }
  .panel.collapsed label,
  .panel.collapsed input,
  .panel.collapsed #connect { display: none; }

  /* centered message; opaque so nothing behind it can bleed through */
  .overlay { position: absolute; inset: 0; z-index: 2; display: none; flex-direction: column;
    align-items: center; justify-content: center; gap: 8px; text-align: center; color: var(--muted-fg);
    padding: 24px; background: #05080b; }
  .overlay.show { display: flex; }
  .overlay .big { font-size: 14px; color: var(--fg); }
  .overlay code { font-family: var(--mono); color: color-mix(in oklch, var(--info) 80%, var(--fg)); }
</style>
</head>
<body class="science dark">

<div class="frame-wrap">
  <iframe id="viewer" title="Rerun viewer" allow="cross-origin-isolated; fullscreen; clipboard-read; clipboard-write"></iframe>

  <div class="overlay" id="overlay">
    <div class="big" id="ov-title">Looking for a Rerun viewer…</div>
    <div id="ov-msg">Start one with <code>rerun --serve-web</code> (web on :9090). This keeps retrying.</div>
  </div>

  <div class="panel" id="panel">
    <span class="title">Rerun</span>
    <label>host</label><input id="host" type="text" spellcheck="false" autocomplete="off" />
    <label>port</label><input id="port" type="text" inputmode="numeric" spellcheck="false" autocomplete="off" />
    <button class="btn" id="connect">Connect</button>
    <span class="stat"><span class="dot" id="dot"></span><span id="stat">…</span></span>
  </div>
</div>

<script type="module">
const hostEl = document.getElementById("host")
const portEl = document.getElementById("port")
const viewer = document.getElementById("viewer")
const panel = document.getElementById("panel")
const dot = document.getElementById("dot")
const statEl = document.getElementById("stat")
const overlay = document.getElementById("overlay")
const ovTitle = document.getElementById("ov-title")
const ovMsg = document.getElementById("ov-msg")

const saved = JSON.parse(localStorage.getItem("dimos.rerun") || "{}")
hostEl.value = saved.host || "localhost"
portEl.value = saved.port || "9090"

const DATA_PORT = 9876

// The web viewer (default :9090) needs a `?url=` pointing at the data proxy
// (gRPC, default :9876), so for a bare host:port we append the default proxy and
// `rerun --serve-web` "just works". Paste a full URL (with your own ?url=) to override.
function targetUrl() {
  let host = hostEl.value.trim()
  const port = portEl.value.trim()
  if (!host) host = "localhost"
  if (/^https?:\/\//i.test(host)) return host
  let h = host, base
  if (host.includes(":")) { base = "http://" + host; h = host.split(":")[0] }
  else base = `http://${host}${port ? ":" + port : ""}`
  if (base.includes("?")) return base
  return base + `?url=rerun%2Bhttp%3A%2F%2F${h}%3A${DATA_PORT}%2Fproxy`
}

// The plain http origin to probe for reachability (no ?url).
function reachUrl() {
  let host = hostEl.value.trim() || "localhost"
  const port = portEl.value.trim()
  if (/^https?:\/\//i.test(host)) { try { return new URL(host).origin } catch { return host } }
  if (host.includes(":")) return "http://" + host
  return `http://${host}${port ? ":" + port : ""}`
}

// Best-effort reachability check: a no-cors GET resolves (opaque) if the server
// answers at all, and rejects on connection-refused / DNS failure.
async function probe(url) {
  try {
    const signal = AbortSignal.timeout ? AbortSignal.timeout(2500) : undefined
    await fetch(url, { mode: "no-cors", cache: "no-store", signal })
    return true
  } catch { return false }
}

let connected = false
let loadedUrl = null

function applyState(isConnected) {
  connected = isConnected
  panel.classList.toggle("collapsed", isConnected)
  overlay.classList.toggle("show", !isConnected)
  dot.className = "dot" + (isConnected ? " on" : " err")
  statEl.textContent = isConnected ? "connected" : "waiting…"
  if (!isConnected) {
    // blank the frame so a down server never renders the browser's error page
    viewer.removeAttribute("src")
    loadedUrl = null
  }
}

async function tick() {
  const ok = await probe(reachUrl())
  if (ok) {
    const desired = targetUrl()
    if (loadedUrl !== desired) { viewer.src = desired; loadedUrl = desired }
    if (!connected) applyState(true)
  } else if (connected || loadedUrl !== null) {
    applyState(false)
  } else {
    overlay.classList.add("show")
    dot.className = "dot err"
    statEl.textContent = "waiting…"
  }
}

// Manual (re)connect: save target, drop the current frame, expand controls, retry now.
function connect() {
  localStorage.setItem("dimos.rerun", JSON.stringify({ host: hostEl.value.trim(), port: portEl.value.trim() }))
  connected = false
  loadedUrl = null
  viewer.removeAttribute("src")
  panel.classList.remove("collapsed")
  overlay.classList.add("show")
  ovTitle.textContent = "Connecting…"
  ovMsg.innerHTML = 'Waiting for a Rerun web viewer at <code>' + reachUrl() + '</code>. This keeps retrying.'
  tick()
}

document.getElementById("connect").addEventListener("click", (e) => { e.stopPropagation(); connect() })
for (const el of [hostEl, portEl]) el.addEventListener("keydown", (e) => { if (e.key === "Enter") connect() })

// click the collapsed pill to expand the controls again
panel.addEventListener("click", () => { if (panel.classList.contains("collapsed")) panel.classList.remove("collapsed") })

applyState(false)
tick()
setInterval(tick, 3000)
</script>
</body>
</html>
