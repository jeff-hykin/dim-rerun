title: Rerun
spec-version: v1.0 # the dimos.yaml spec version this file follows
uses:
    "@dimos-gateway":
        - GET /runs
    "@desktop-gateway":
        - GET /api/apps
    # the dim-app SDK's zenoh client (backend state, events): the zenoh bridge and how it finds it
    "@zenoh-gateway": ">=0.5 <0.6"
# the page runs Rerun's web viewer, which reads a Rerun gRPC server (gRPC-web fetches): on Desktop's machine as the
# browser reached Desktop (its host, the settings' port), or any host/port the settings name; and .rrd recording URLs
connects:
    - http://*:*
    - https://*:*
caches:
    - url: "https://dimos-desktop.cachix.org"
      key: "dimos-desktop.cachix.org-1:A4P35aGJGmCan92LWyamtSFXMqaVE+VRFYnrJ8QMTeQ="
provides:
    # what its server answers only its own pages (its endpoints: below are the public API)
    private:
        - api/state/*
        - api/grpc/*
        - api/recording/*
    description: >-
        Rerun: Rerun's web viewer inside Desktop, on a live gRPC stream (dimos's Rerun bridge by default) or a recording
        (.rrd)
    endpoints:
        - method: GET
          path: api/state
          description: >-
              Rerun's state: the settings' gRPC server, what the viewer shows (default stream, a stream address, a
              recording URL or local .rrd; @host = the host the browser reached Desktop at), and whether the gRPC
              server answers
          role: context
        - method: POST
          path: api/settings
          description: >-
              The app's setting, saved: grpc, the Rerun gRPC server the viewer shows by default, a port on Desktop's
              machine (default 9877, where dimos's Rerun bridge serves) or a rerun+http(s)://host:port/proxy URL.
              Answers the new state
          params:
              grpc:
                  type: string
                  required: true
                  description: "a port (default 9877) or rerun+http(s)://host:port/proxy"
        - method: POST
          path: api/open
          description: >-
              Show something in the viewer: url = a live stream address (rerun+http://host:9877/proxy) or an http(s)
              .rrd recording URL; or path = a local .rrd file (served to the viewer by this app)
          params:
              url:
                  type: string
                  description: "rerun+http(s):// stream address, or http(s) URL of a .rrd"
              path:
                  type: string
                  description: absolute path of a local .rrd file
        - method: DELETE
          path: api/open
          description: 'Go back to the default live stream (the settings'' gRPC server, rerun+http://<host>:9877/proxy)'
        - method: GET
          path: api/grpc/check
          description: >-
              Whether the shown gRPC server lets a page at origin read it (Rerun allows only localhost origins unless
              started with --cors-allow-origin); allowed null = it doesn't answer, or a recording is shown
          params:
              origin:
                  type: string
                  required: true
                  description: 'the page''s origin as the browser reaches it, e.g. http://100.64.0.1:5555'
        - method: POST
          path: api/server/start
          description: >-
              Start a Rerun gRPC server on Desktop's machine (`rerun --serve-grpc` on the settings' port, any host may
              read it) when none answers there; dimos's Rerun bridges started later send to it
        - method: POST
          path: api/reconnect
          description: Check the gRPC server again now and reopen the source in the viewer (when it restarted)
        - method: GET
          path: "api/recording/{name}"
          description: "The local .rrd opened with api/open path, as bytes (what the viewer loads)"
          params:
              name:
                  type: string
                  required: true
                  description: the file's name (the viewer goes by its .rrd extension)
nix:
    cache:
        aarch64-linux:
            - packages.aarch64-darwin.dimosApp-aarch64-linux
            - packages.x86_64-linux.dimosApp-aarch64-linux
        x86_64-linux:
            - packages.aarch64-darwin.dimosApp-x86_64-linux
